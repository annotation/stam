variables:
  GIT_DEPTH: 0

#deploys to  https://tt.pages.huc.knaw.nl/stam 
pages:
  image: alpine:latest
  script:
    - apk add make python3 py3-pip git tzdata
    - make specs
    - mv site public
  pages: true
  artifacts:
    paths:
      - public
  environment: production
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
